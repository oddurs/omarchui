name: Bug report
description: Something on the site, in the design system or in the demo does not work.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or component, e.g. /demo or /system/components/menu.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /demo and unlock
        2. Press Alt+Return
        3. …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and theme
      placeholder: Chrome 140 on macOS, Tokyo Night, dark
    validations:
      required: true
